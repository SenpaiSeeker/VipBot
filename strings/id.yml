about:
  title: "**🌟 Tentang Bot VVIP Ini**"
  description: "Selamat datang! Saya adalah asisten otomatis yang dirancang untuk memberikan Anda kemudahan dalam mengakses grup-grup VVIP secara instan."
  main_function_title: "**🤖 Fungsi Utama Saya:**"
  main_function_desc: "Saya menyediakan sistem pembayaran otomatis yang aman, memastikan Anda mendapatkan akses ke konten premium segera setelah transaksi berhasil, tanpa menunggu konfirmasi manual."
  workflow_title: "**🚀 Alur Penggunaan:**"
  workflow_steps: "1. **Pilih Paket:** Jelajahi daftar VVIP yang tersedia.\n2. **Lakukan Pembayaran:** Gunakan QRIS yang saya berikan.\n3. **Akses Instan:** Tautan undangan grup akan otomatis terkirim setelah pembayaran terkonfirmasi."
  closing: "Semua proses dirancang agar cepat, aman, dan mudah!"

