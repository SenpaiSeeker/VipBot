donation:
  title: "**❤️ Dukung Kami dengan Telegram Stars!**"
  description: |
    Dukungan Anda sangat berarti untuk membantu kami terus mengembangkan dan memelihara bot ini.
    
    Setiap Star yang Anda berikan memberikan kami semangat untuk terus berinovasi. Pilih jumlah donasi di bawah ini untuk memulai.
    
    Terima kasih atas dukungan Anda yang luar biasa!

