donation:
  panel_text: |
    **❤️ Dukung Kami dengan Telegram Stars!**

    Donasi Anda sangat berarti untuk membantu kami terus mengembangkan dan memelihara bot ini.
    Setiap Star yang Anda berikan memberikan kami semangat untuk terus berinovasi. Pilih jumlah donasi di bawah ini untuk memulai.

    Terima kasih atas dukungan Anda!
  buttons_layout: |
