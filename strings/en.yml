about:
  full_text: |
    **🌟 About This VVIP Bot**

    Welcome! I am an automated assistant designed to provide you with easy access to VVIP groups.

    **🤖 My Main Function:**
    I provide a secure automatic payment system via QRIS, ensuring you get instant access to premium content after a successful transaction.

    **🚀 Usage Flow:**
    1. **Select a Package:** Browse the list of available VVIPs.
    2. **Make a Payment:** Scan the QRIS I provide.
    3. **Instant Access:** An invitation link will be sent automatically after payment is confirmed.

    The entire process is designed to be fast, secure, and without the need for manual confirmation!
    
    | {back_button} - start |

